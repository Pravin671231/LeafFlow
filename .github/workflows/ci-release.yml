name: CI Release

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test (backend)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage --workspace=backend
        env:
          MONGODB_URI: mongodb://localhost:27017/leafflow_test
      - uses: codecov/codecov-action@v4
        with:
          name: coverage-backend
          directory: Backend/coverage/

  e2e:
    if: false # E2E placeholder — activated in Issue #62
    name: E2E
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start production stack
        run: docker compose -f docker-compose.prod.yml up -d --build
      - name: Wait for backend health
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://localhost:5000/health; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Attempt $i/12 — retrying in 5s..."
            sleep 5
          done
          echo "Backend did not become healthy within 60 s" >&2
          exit 1
      - name: E2E placeholder
        run: |
          echo "E2E placeholder — activated in Issue 62"
      - name: Teardown stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
